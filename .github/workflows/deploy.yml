name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    environment:
      name: github-pages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: npm ci

      - name: Verify form endpoint config
        run: |
          if [ -z "$VITE_FORM_ENDPOINT" ]; then
            echo "VITE_FORM_ENDPOINT is not configured for this build."
            echo "Add it as a GitHub Actions variable or secret named VITE_FORM_ENDPOINT."
            exit 1
          fi
          echo "VITE_FORM_ENDPOINT is configured for this build."
        env:
          VITE_FORM_ENDPOINT: ${{ vars.VITE_FORM_ENDPOINT || secrets.VITE_FORM_ENDPOINT }}

      - name: Build
        run: npm run build
        env:
          VITE_FORM_ENDPOINT: ${{ vars.VITE_FORM_ENDPOINT || secrets.VITE_FORM_ENDPOINT }}
          VITE_OCR_API_BASE_URL: ${{ vars.VITE_OCR_API_BASE_URL || secrets.VITE_OCR_API_BASE_URL || 'https://flowtally-backend.onrender.com' }}
          VITE_BASE_PATH: ${{ vars.VITE_BASE_PATH }}
          VITE_GA_MEASUREMENT_ID: ${{ vars.VITE_GA_MEASUREMENT_ID || secrets.VITE_GA_MEASUREMENT_ID }}
          VITE_PLAUSIBLE_DOMAIN: ${{ vars.VITE_PLAUSIBLE_DOMAIN || secrets.VITE_PLAUSIBLE_DOMAIN || 'flowtally.ca' }}

      - name: Support client-side routes
        run: |
          cp dist/index.html dist/404.html
          for route in pilot pilot/invoices pilot/daily-reconciliation pilot/price-changes pilot/inventory demo demo/cafe demo/cafe/invoices demo/cafe/daily-reconciliation demo/cafe/inventory demo/cafe/price-tracker demo/cafe/monthly-report demo/cafe/settings demo/quick-service demo/quick-service/invoices demo/quick-service/daily-reconciliation demo/quick-service/inventory demo/quick-service/price-tracker demo/quick-service/monthly-report demo/quick-service/settings demo/full-service demo/full-service/invoices demo/full-service/daily-reconciliation demo/full-service/inventory demo/full-service/price-tracker demo/full-service/monthly-report demo/full-service/settings app app/invoices app/inventory app/price-tracker app/monthly-report app/upload app/suppliers app/items app/settings app/price-changes app/reports; do
            mkdir -p "dist/$route"
            cp dist/index.html "dist/$route/index.html"
          done

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
