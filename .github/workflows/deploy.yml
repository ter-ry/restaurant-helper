name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    environment:
      name: github-pages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: npm ci

      - name: Verify form endpoint config
        run: |
          if [ -z "$VITE_FORM_ENDPOINT" ]; then
            echo "VITE_FORM_ENDPOINT is not configured for this build."
            echo "Add it as a GitHub Actions variable or secret named VITE_FORM_ENDPOINT."
            exit 1
          fi
          echo "VITE_FORM_ENDPOINT is configured for this build."
        env:
          VITE_FORM_ENDPOINT: ${{ vars.VITE_FORM_ENDPOINT || secrets.VITE_FORM_ENDPOINT }}

      - name: Build
        run: npm run build
        env:
          VITE_FORM_ENDPOINT: ${{ vars.VITE_FORM_ENDPOINT || secrets.VITE_FORM_ENDPOINT }}
          VITE_BASE_PATH: ${{ vars.VITE_BASE_PATH }}

      - name: Support client-side routes
        run: |
          cp dist/index.html dist/404.html
          mkdir -p dist/pilot
          cp dist/index.html dist/pilot/index.html

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
