# Secretless, nonprivileged CI for ALL trusted-review security tests (issue #286):
# attestation verifier (#283), evidence collector (#285) and the reviewer/verifier runtime.
# Runs on `pull_request` with a read-only token and no secrets, so PR-head Python never
# executes with any credential. Required result name: `trusted-review-security-tests`.
name: Trusted review security tests

on:
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  trusted-review-security-tests:
    name: trusted-review-security-tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install "cryptography>=42.0,<44.0"
      - run: python -m py_compile scripts/trusted_review_attestation.py scripts/trusted_review_evidence_collector.py scripts/trusted_review_runtime.py scripts/develop_merge_policy.py
      - name: Run every trusted-review test (fails on any failure, or if none are found)
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover -s scripts/tests -p 'test_trusted_review_*.py' -v > /tmp/tr.log 2>&1 || { cat /tmp/tr.log; exit 1; }
          cat /tmp/tr.log
          grep -Eq '^Ran [1-9][0-9]* tests' /tmp/tr.log
          tail -n 5 /tmp/tr.log | grep -Eq '^OK'
