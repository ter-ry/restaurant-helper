name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: flowtally_test
          POSTGRES_USER: flowtally
          POSTGRES_PASSWORD: flowtally
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U flowtally -d flowtally_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      FLOWTALLY_TEST_POSTGRES_URL: postgresql+psycopg2://flowtally:flowtally@localhost:5432/flowtally_test
      DATABASE_URL: postgresql+psycopg2://flowtally:flowtally@localhost:5432/flowtally_test
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install backend and root dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt -r requirements.txt

      - name: Verify clean diff
        run: git diff --check

      - name: Fresh-database migration check
        timeout-minutes: 10
        run: python -u -m pytest backend/tests/test_seed.py::test_migrations_upgrade_and_seed_on_fresh_database -vv --durations=20

      - name: PostgreSQL migration acceptance tests
        timeout-minutes: 15
        run: python -u -m pytest backend/tests/test_migrations_postgres.py -vv -x --durations=20

      - name: PostgreSQL RLS authorization diagnostics
        timeout-minutes: 10
        run: python -u -m pytest backend/tests/test_postgres_rls.py::test_postgres_rls_authorization_chain_diagnostics -vv -x -s --durations=20

      - name: PostgreSQL RLS and security tests
        timeout-minutes: 5
        run: python -u -m pytest backend/tests/test_postgres_rls.py::test_rls_hides_other_tenant_rows -vv -x -s --durations=20

      - name: PostgreSQL RLS and security tests - cross-tenant write
        timeout-minutes: 5
        run: python -u -m pytest backend/tests/test_postgres_rls.py::test_rls_blocks_cross_tenant_insert_and_update -vv -x -s --durations=20

      - name: PostgreSQL RLS and security tests - support grant
        timeout-minutes: 5
        run: python -u -m pytest backend/tests/test_postgres_rls.py::test_support_requires_active_grant -vv -x -s --durations=20

      - name: PostgreSQL RLS and security tests - square sales
        timeout-minutes: 5
        run: python -u -m pytest backend/tests/test_postgres_rls.py::test_rls_protects_square_sales_tables -vv -x -s --durations=20

      - name: PostgreSQL RLS and security tests - imports
        timeout-minutes: 5
        run: python -u -m pytest backend/tests/test_postgres_rls.py::test_rls_covers_import_tables_and_selected_organization_views -vv -x -s --durations=20

      - name: PostgreSQL RLS and security tests - setup scope
        timeout-minutes: 5
        run: python -u -m pytest backend/tests/test_postgres_rls.py::test_setup_scope_can_access_platform_data_across_organizations -vv -x -s --durations=20

      - name: Remaining backend tests
        timeout-minutes: 25
        run: python -u -m pytest backend/tests --ignore=backend/tests/test_migrations_postgres.py --ignore=backend/tests/test_postgres_rls.py -vv -x --durations=20

      - name: Root Python tests
        timeout-minutes: 10
        run: python -u -m unittest discover -s tests -v

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint frontend
        run: npm run lint

      - name: Type-check frontend
        run: |
          npm run typecheck

      - name: Frontend unit tests
        run: npm test

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Frontend browser tests
        run: npm run e2e

      - name: Build frontend
        run: npm run build
