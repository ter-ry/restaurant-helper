name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - codex/**

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: flowtally_test
          POSTGRES_USER: flowtally
          POSTGRES_PASSWORD: flowtally
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U flowtally -d flowtally_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      FLOWTALLY_TEST_POSTGRES_URL: postgresql+psycopg2://flowtally:flowtally@localhost:5432/flowtally_test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install backend and root dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt -r requirements.txt

      - name: Verify clean diff
        run: git diff --check

      - name: Fresh-database migration check
        run: python -m pytest backend/tests/test_seed.py::test_migrations_upgrade_and_seed_on_fresh_database

      - name: Pilot backend tests
        run: python -m pytest backend/tests

      - name: Root Python tests
        run: python -m unittest discover -s tests

  frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint frontend
        run: npm run lint

      - name: Type-check frontend
        run: |
          npm run typecheck

      - name: Frontend unit tests
        run: npm test

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Frontend browser tests
        run: npm run e2e

      - name: Build frontend
        run: npm run build
