# One-time owner-triggered exception for the pinned #387 integration evidence.
# This is deliberately separate from trusted-review.yml: it has no schedule,
# no pull_request trigger, no PR approval permission, and live writes are off by default.
name: Manual trusted integration verification

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: "Must be 387"
        required: true
        default: "387"
      head_sha:
        description: "Must be 392c26f1a949f798607d6bcb35eee01f0732726e"
        required: true
        default: "392c26f1a949f798607d6bcb35eee01f0732726e"
      base_sha:
        description: "Must be 4edbc8cafb3bfecd8cc3d67161887b3d9d6e7229"
        required: true
        default: "4edbc8cafb3bfecd8cc3d67161887b3d9d6e7229"

permissions: {}

jobs:
  verify:
    if: ${{ github.actor == 'ter-ry' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: flowtally-manual-trusted-verifier
    permissions:
      contents: read
    env:
      GITHUB_ACTOR: ${{ github.actor }}
      FLOWTALLY_MANUAL_TRUSTED_REVIEW_LIVE_WRITES: ${{ vars.FLOWTALLY_MANUAL_TRUSTED_REVIEW_LIVE_WRITES }}
      FLOWTALLY_REVIEWER_PUBLIC_KEY: ${{ vars.FLOWTALLY_REVIEWER_PUBLIC_KEY }}
      FLOWTALLY_RULESET_ATTESTATION: ${{ vars.FLOWTALLY_RULESET_ATTESTATION }}
      FLOWTALLY_RULESET_ATTESTATION_PUBLIC_KEY: ${{ vars.FLOWTALLY_RULESET_ATTESTATION_PUBLIC_KEY }}
      FLOWTALLY_RULESET_OBSERVER_APP_ID: ${{ vars.FLOWTALLY_RULESET_OBSERVER_APP_ID }}
      FLOWTALLY_VERIFIER_APP_PRIVATE_KEY: ${{ secrets.FLOWTALLY_VERIFIER_APP_PRIVATE_KEY }}
      VERIFIER_APP_ID: ${{ vars.VERIFIER_APP_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install "cryptography>=42.0,<44.0"
      - name: Verify pinned integration evidence
        run: |
          set -euo pipefail
          test "${{ inputs.pr_number }}" = "387"
          test "${{ inputs.head_sha }}" = "392c26f1a949f798607d6bcb35eee01f0732726e"
          test "${{ inputs.base_sha }}" = "4edbc8cafb3bfecd8cc3d67161887b3d9d6e7229"
          python scripts/manual_trusted_review.py
