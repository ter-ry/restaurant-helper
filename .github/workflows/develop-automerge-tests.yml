name: develop-automerge-tests

# Offline fail-closed tests for scripts/develop_automerge_controller.py (issue #270).
# No secrets, read-only token, no network: safe to run on PR-head code.
on:
  pull_request:
    paths:
      - "scripts/develop_automerge_controller.py"
      - "scripts/develop_merge_policy.py"
      - "scripts/trusted_review_*.py"
      - "scripts/tests/test_develop_automerge_controller.py"
      - ".github/workflows/develop-automerge*.yml"

permissions:
  contents: read

jobs:
  develop-automerge-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install cryptography
      - name: Run tests (fail on any failure or zero tests)
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover -s scripts/tests -p 'test_develop_automerge_controller.py' -v 2> out.txt || { cat out.txt; exit 1; }
          cat out.txt
          grep -Eq '^Ran [1-9][0-9]* tests?' out.txt
