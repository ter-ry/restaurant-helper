services:
  - type: web
    name: flowtally-api-demo
    env: python
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    startCommand: flask --app backend.wsgi:app db upgrade && gunicorn backend.wsgi:app --bind 0.0.0.0:$PORT --access-logfile - --error-logfile -
    healthCheckPath: /api/health
    envVars:
      - key: FLOWTALLY_ENV
        value: staging
      - key: DATABASE_URL
        sync: false
      - key: FLOWTALLY_MIGRATION_DATABASE_URL
        sync: false
      - key: SECRET_KEY
        sync: false
      - key: FLOWTALLY_ALLOWED_ORIGINS
        value: https://flowtally-demo.onrender.com
      - key: FLOWTALLY_FRONTEND_ORIGIN
        value: https://flowtally-demo.onrender.com
      - key: FLOWTALLY_ENFORCE_SPLIT_ORIGIN_CSRF
        value: "true"
      - key: SESSION_COOKIE_SECURE
        value: "true"
      - key: SESSION_COOKIE_SAMESITE
        value: Lax
      - key: SESSION_COOKIE_NAME
        value: flowtally_demo_session
      - key: FLOWTALLY_RATE_LIMIT_STORAGE_URI
        value: memory://
      - key: FLOWTALLY_ALLOW_SQLITE_IN_NONLOCAL
        value: "false"
      - key: GOOGLE_OIDC_ENABLED
        value: "false"
      - key: SQUARE_ENABLED
        value: "false"
      - key: FLOWTALLY_DEMO_READ_ONLY
        value: "true"
      - key: FLOWTALLY_DEMO_ISOLATED
        value: "true"
      - key: FLOWTALLY_DEMO_DATABASE_NAME
        sync: false

