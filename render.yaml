services:
  - type: web
    name: flowtally-legacy-root-app
    env: python
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    startCommand: gunicorn backend.wsgi:app --bind 0.0.0.0:$PORT --access-logfile - --error-logfile -
    healthCheckPath: /api/health
    envVars:
      - key: FLOWTALLY_ENV
        value: development
